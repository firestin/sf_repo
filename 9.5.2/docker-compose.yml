version: '3.8'

services:
  php:
    build: .
    container_name: php-app
    healthcheck:
      test: ["CMD", "curl", "-s", "http://nginx", "|", "grep", "works"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - .:/var/www/html
    expose:
      - 9000

  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - .:/var/www/html
    depends_on:
      - php
